<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abed Tayara</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b); color: #f1f5f9; padding: 16px;
  }
  .card { text-align: center; max-width: 520px; }
  h1 { font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -0.02em; }
  p { margin-top: 12px; color: #94a3b8; font-size: 1.1rem; }
  .badge { display: inline-block; margin-top: 24px; padding: 8px 18px; border-radius: 999px;
    background: #38bdf8; color: #0f172a; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <h1>Abed Tayara</h1>
    <p>Something new is on the way.</p>
    <span class="badge">Coming soon</span>
  </div>
</body>
</html>
